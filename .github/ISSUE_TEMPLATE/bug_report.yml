name: Bug report
description: Report broken behavior, regressions, or reliability problems.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one reproducible problem. Search existing issues first.
        Never include credentials, private schemas, model data, or other secrets.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I reduced the problem to the smallest useful reproduction.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kit or mounted UI
        - Headless runtime
        - Schema or built-in kinds
        - Transport
        - Primitives or design system
        - Package exports or build
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small schema, transport, code sample, or repository and exact steps.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MLForm version or commit
      placeholder: 0.1.24 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, and bundler when relevant.
      placeholder: Chrome 140, Windows 11, Node.js 24, Vite 8

  - type: textarea
    id: evidence
    attributes:
      label: Logs or supporting evidence
      description: Include only relevant output, screenshots, or recordings. Redact secrets.

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Include any temporary workaround you found.
