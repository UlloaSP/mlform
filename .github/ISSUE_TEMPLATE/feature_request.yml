name: Proposal
description: Propose a focused improvement to MLForm.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        MLForm is pre-1.0 and deliberately keeps its public surface small.
        Describe the problem before prescribing an API. One proposal per issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for an existing solution.
          required: true
        - label: This proposal solves a concrete current need, not a speculative future one.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and what can they not do today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without assuming a particular implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing MLForm layers, browser APIs, or application-level solutions you tried.

  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs
      description: Note affected packages, public APIs, compatibility, bundle size, or runtime costs.
